[build]
  publish = "."

# ── Seguridad: aplica a todo el sitio ─────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), interest-cohort=()"
    Cross-Origin-Opener-Policy = "same-origin"

# ── Caché larga para estáticos versionables ───────────────────────
[[headers]]
  for = "/Images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.pdf"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# ── Constancias: se abren desde los enlaces del sitio, pero no se ─
#    indexan, porque los documentos nombran a los coautores ─────────
[[headers]]
  for = "/constancias/*"
  [headers.values]
    X-Robots-Tag = "noindex"

# ── El README de constancias es documentación interna: vive en el ─
#    repo, pero no se sirve ─────────────────────────────────────────
[[redirects]]
  from = "/constancias/README.md"
  to = "/404.html"
  status = 404
  force = true

# ── El HTML siempre se revalida (deploys inmediatos) ──────────────
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

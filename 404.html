<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    min-height:100vh;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:6px;
    background:#0e1013;color:#e4e0d6;
    font-family:'DM Sans',system-ui,sans-serif;
    text-align:center;padding:32px 20px;
  }
  .code{
    font-family:'Playfair Display',serif;
    font-size:clamp(4.5rem,16vw,9rem);font-weight:800;line-height:1;
    background:linear-gradient(125deg,#f7f3e9 25%,#ecd9a8 70%,#c9a35c 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .kicker{
    color:#d4b06a;font-size:.68rem;font-weight:700;
    letter-spacing:4px;text-transform:uppercase;margin-bottom:10px;
  }
  p{color:#84878d;font-size:.95rem;max-width:34ch;margin:10px 0 26px}
  .actions{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
  a{
    display:inline-flex;align-items:center;gap:8px;
    padding:11px 24px;border-radius:999px;
    font-size:.75rem;font-weight:700;letter-spacing:1.2px;
    text-transform:uppercase;text-decoration:none;
    transition:transform .2s,background .2s,box-shadow .2s;
  }
  .gold{background:linear-gradient(135deg,#e3c27e,#b08c46);color:#171204;box-shadow:0 6px 22px rgba(212,176,106,.25)}
  .gold:hover{transform:translateY(-2px);box-shadow:0 10px 30px rgba(212,176,106,.4)}
  .ghost{border:1px solid rgba(212,176,106,.45);color:#ead9b4}
  .ghost:hover{background:rgba(212,176,106,.12);transform:translateY(-2px)}
  a:focus-visible{outline:2px solid #d4b06a;outline-offset:3px}
  @media (prefers-reduced-motion:reduce){a{transition:none}}
</style>
</head>
<body>
  <div class="kicker">Error 404</div>
  <div class="code">404</div>
  <p>This page does not exist. / Esta página no existe. / 此页面不存在。</p>
  <div class="actions">
    <a class="gold" href="/">Home · Inicio · 首页</a>
    <a class="ghost" href="/Galeria/">Gallery</a>
